# Configuration Netlify — site Astro statique.
# Les en-têtes de sécurité et les redirections sont dans public/_headers et public/_redirects
# (copiés dans dist/ au build ; ils fonctionnent aussi pour un dépôt par glisser-déposer de dist/).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"
